modules:
  scoring:
    type: Scoring
    activity_params:
      - activity_type: h
        typical_duration_s: 43200.0
      - activity_type: w
        typical_duration_s: 28800.0
    mode_params:
      - mode: walk
        marginal_utility_of_traveling: -6.0
        marginal_utility_of_distance: 0.0
        monetary_distance_cost_rate: 0.0
        daily_money_constant: 0.0
        daily_utility_constant: 0.0
        constant: 0.0
      - mode: pt
        marginal_utility_of_traveling: -6.0
        marginal_utility_of_distance: 0.0
        monetary_distance_cost_rate: 0.0
        daily_money_constant: 0.0
        daily_utility_constant: 0.0
        constant: 0.0
  network:
    type: Network
    path: ./assets/pt_tutorial/multimodalnetwork.xml
  population:
    type: Population
    path: ./tests/resources/pt_reference/routing_distinct_platform_transfer/plans.xml
  vehicles:
    type: Vehicles
    path: ./assets/pt_tutorial/vehicles.xml
  transit:
    type: Transit
    schedule_path: ./tests/resources/pt_reference/routing_distinct_platform_transfer/transit_schedule.xml
    simulate_vehicles: false
  partitioning:
    type: Partitioning
    num_parts: 1
    method: !Metis
      vertex_weight:
        - Constant
  output:
    type: Output
    overwrite_files: DeleteDirectoryIfExists
    output_dir: ./test_output/simulation/pt_distinct_platform_execution
  routing:
    type: Routing
    mode: UsePlans
    teleported_mode_params:
      - mode: walk
        beeline_distance_factor: 1.3
        teleported_mode_speed: 0.8333333333333334
  qsim:
    type: QSim
    start_time: 0
    end_time: 86400
  controller:
    type: Controller
    last_iteration: 0
