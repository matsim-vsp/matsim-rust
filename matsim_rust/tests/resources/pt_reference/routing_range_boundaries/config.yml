modules:
  network:
    type: Network
    path: ./assets/pt_tutorial/multimodalnetwork.xml
  vehicles:
    type: Vehicles
    path: ./assets/pt_tutorial/vehicles.xml
  transit:
    type: Transit
    schedule_path: ./tests/resources/pt_reference/routing_range_boundaries/transit_schedule.xml
    range_query_settings:
      - max_earlier_departure_sec: 60
        max_later_departure_sec: 60
    route_selector_settings:
      - beta_departure_time: 1.0
        beta_travel_time: 1.0
        beta_transfer_count: 300.0
  partitioning:
    type: Partitioning
    num_parts: 1
    method: !Metis
      vertex_weight:
        - Constant
  output:
    type: Output
    overwrite_files: DeleteDirectoryIfExists
    output_dir: ./test_output/simulation/pt_reference_routing_range_boundaries
  routing:
    type: Routing
    mode: UsePlans
    teleported_mode_params:
      - mode: walk
        beeline_distance_factor: 1.3
        teleported_mode_speed: 0.8333333333333334
  qsim:
    type: QSim
    start_time: 0
    end_time: 86400
  controller:
    type: Controller
    last_iteration: 0
