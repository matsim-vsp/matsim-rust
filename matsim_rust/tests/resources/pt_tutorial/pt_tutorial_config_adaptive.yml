modules:
  scoring:
    type: Scoring
    scoring_parameters_path: scoring-parameters.yml
  network:
    type: Network
    path: ./assets/pt_tutorial/multimodalnetwork.xml
  population:
    type: Population
    path: ./assets/pt_tutorial/plans_1.xml.gz
  vehicles:
    type: Vehicles
    path: ./assets/pt_tutorial/vehicles.xml
  transit:
    type: Transit
    schedule_path: ./assets/pt_tutorial/transitschedule.xml
  partitioning:
    type: Partitioning
    num_parts: 1
    method: !Metis
      vertex_weight:
        - Constant
  output:
    type: Output
    overwrite_files: DeleteDirectoryIfExists
    output_dir: ./test_output/simulation/pt_tutorial_adaptive
    write_events: XmlGz
  routing:
    type: Routing
    mode: AdHoc
  simulation:
    type: Simulation
    last_iteration: 0
