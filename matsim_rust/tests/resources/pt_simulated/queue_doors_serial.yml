modules:
  scoring:
    type: Scoring
    activity_params:
      - { activity_type: h, typical_duration_s: 43200.0 }
      - { activity_type: w, typical_duration_s: 28800.0 }
    mode_params:
      - { mode: walk, marginal_utility_of_traveling: -6.0, marginal_utility_of_distance: 0.0, monetary_distance_cost_rate: 0.0, daily_money_constant: 0.0, daily_utility_constant: 0.0, constant: 0.0 }
      - { mode: pt, marginal_utility_of_traveling: -6.0, marginal_utility_of_distance: 0.0, monetary_distance_cost_rate: 0.0, daily_money_constant: 0.0, daily_utility_constant: 0.0, constant: 0.0 }
  network: { type: Network, path: ./assets/pt_tutorial/multimodalnetwork.xml }
  population: { type: Population, path: ./tests/resources/pt_reference/queue_doors_common/plans.xml }
  vehicles: { type: Vehicles, path: ./tests/resources/pt_reference/queue_doors_serial/vehicles_rust.xml }
  transit:
    type: Transit
    schedule_path: ./tests/resources/pt_reference/queue_doors_common/transitSchedule.xml
    simulate_vehicles: true
  routing: { type: Routing, mode: UsePlans }
  partitioning: { type: Partitioning, num_parts: 1, method: !Metis { vertex_weight: [Constant] } }
  simulation: { type: Simulation, last_iteration: 0 }
  output: { type: Output, overwrite_files: DeleteDirectoryIfExists, output_dir: ./test_output/simulation/pt_queue_doors_serial, write_events: XmlGz }
