modules:
  scoring:
    type: Scoring
    scoring_parameters_path: scoring-parameters.yml
  network:
    type: Network
    path: ./assets/equil/equil-network.xml
  population:
    type: Population
    path: ./assets/equil/equil-1-plan.xml
  vehicles:
    type: Vehicles
    path: ./assets/equil/equil-vehicles.xml
  partitioning:
    type: Partitioning
    num_parts: 1
    method: !Metis
  output:
    type: Output
    compression_type: Zst
    overwrite_files: DeleteDirectoryIfExists
    output_dir: ./test_output/simulation/output-simulate-network-route
  routing:
    type: Routing
    mode: UsePlans
    network_modes: [ "car" ]
  simulation:
    type: Simulation
    last_iteration: 0
    start_time: 0
    end_time: 86400
    sample_size: 1.0
    stuck_threshold: 1000
    main_modes: [ "car" ]
  controller:
    type: Controller
    last_iteration: 0
