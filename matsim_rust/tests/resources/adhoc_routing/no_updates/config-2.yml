modules:
  scoring:
    type: Scoring
    scoring_parameters_path: ../scoring-parameters.yml
  protofiles:
    type: ProtoFiles
    network: ./test_output/simulation/adhoc_routing/no_updates/two_parts/network.binpb
    population: ./test_output/simulation/adhoc_routing/no_updates/two_parts/agents.binpb
    vehicles: ./test_output/simulation/adhoc_routing/no_updates/two_parts/vehicles.binpb
    ids: ./test_output/simulation/adhoc_routing/no_updates/two_parts/ids.binpb
  partitioning:
    type: Partitioning
    num_parts: 2
    method: None
  output:
    type: Output
    overwrite_files: DeleteDirectoryIfExists
    output_dir: ./test_output/simulation/adhoc_routing/no_updates/two_parts
    logging: Info
  routing:
    type: Routing
    mode: AdHoc
