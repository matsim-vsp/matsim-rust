modules:
  scoring:
    type: Scoring
    scoring_parameters_path: scoring-parameters.yml
  network:
    type: Network
    path: ./assets/pt_delays/network.xml
  population:
    type: Population
    path: ./assets/pt_delays/plans.xml
  vehicles:
    type: Vehicles
    path: ./assets/pt_delays/vehicles.xml
  transit:
    type: Transit
    schedule_path: ./assets/pt_delays/transit_schedule.xml
    vehicles_path: ./assets/pt_delays/transit_vehicles.xml
    simulation: ScheduleBasedTeleportation
  partitioning:
    type: Partitioning
    num_parts: 1
    method: !Metis
      vertex_weight:
        - Constant
  output:
    type: Output
    overwrite_files: DeleteDirectoryIfExists
    output_dir: ./test_output/simulation/pt_delays
    write_events: File
  routing:
    type: Routing
    mode: UsePlans
  simulation:
    type: Simulation
    last_iteration: 0
