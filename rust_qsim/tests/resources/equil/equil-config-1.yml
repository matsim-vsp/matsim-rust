modules:
  scoring:
    type: Scoring
    activity_params:
      - activity_type: h
        typical_duration_s: 43200.0
      - activity_type: w
        typical_duration_s: 28800.0
  network:
    type: Network
    path: ./assets/equil/equil-network.xml
  population:
    type: Population
    path: ./assets/equil/equil-1-plan.xml
  vehicles:
    type: Vehicles
    path: ./assets/equil/equil-vehicles.xml
  partitioning:
    type: Partitioning
    num_parts: 1
    method: !Metis
      vertex_weight:
        - Constant
  output:
    type: Output
    overwrite_files: DeleteDirectoryIfExists
    output_dir: ./test_output/simulation/equil_single_part
    write_events: File
  routing:
    type: Routing
    mode: UsePlans
    network_modes: [ "car" ]
  controller:
    type: Controller
    last_iteration: 0
    compression_type: Zst
    write_events_interval: 1
    write_plans_interval: 1
  qsim:
    type: QSim
    main_modes: [ "car" ]
