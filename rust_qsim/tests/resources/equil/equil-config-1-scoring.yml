modules:
  network:
    type: Network
    path: ./assets/equil/equil-network.xml
  population:
    type: Population
    path: ./assets/equil/equil-1-plan.xml
  vehicles:
    type: Vehicles
    path: ./assets/equil/equil-vehicles.xml
  partitioning:
    type: Partitioning
    num_parts: 1
    method: !Metis
      vertex_weight:
        - Constant
  output:
    type: Output
    overwrite_files: DeleteDirectoryIfExists
    output_dir: ./test_output/simulation/scoring_backpacking_1
    write_events: None
  routing:
    type: Routing
    mode: UsePlans
  controller:
    type: Controller
    last_iteration: 1
    compression_type: XmlZst
    write_events_interval: 1
    write_plans_interval: 1
  qsim:
    type: QSim
    main_modes: [ "car" ]
  scoring:
    type: Scoring
    write_experienced_plans: true
