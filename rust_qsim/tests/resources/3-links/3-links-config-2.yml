modules:
  network:
    type: Network
    path: ./assets/3-links/3-links-network.xml
  population:
    type: Population
    path: ./assets/3-links/1-agent-full-leg.xml
  vehicles:
    type: Vehicles
    path: ./assets/3-links/vehicles.xml
  partitioning:
    type: Partitioning
    num_parts: 2
    method: !Metis
      vertex_weight:
        - Constant
  output:
    type: Output
    overwrite_files: DeleteDirectoryIfExists
    output_dir: ./test_output/simulation/execute_3_links_2_parts
    write_events: File
  simulation:
    type: Simulation
    last_iteration: 0
    main_modes: [ "car" ]
  routing:
    type: Routing
    mode: UsePlans
    network_modes: [ "car", "bike" ]
  scoring:
    type: Scoring
    mode_params:
      - mode: car
        marginal_utility_of_traveling: 0.0
        marginal_utility_of_distance: 0.0
        monetary_distance_cost_rate: 0.0
        daily_money_constant: 0.0
        daily_utility_constant: 0.0
        constant: 0.0
      - mode: bike
        marginal_utility_of_traveling: 0.0
        marginal_utility_of_distance: 0.0
        monetary_distance_cost_rate: 0.0
        daily_money_constant: 0.0
        daily_utility_constant: 0.0
        constant: 0.0
      - mode: walk
        marginal_utility_of_traveling: 0.0
        marginal_utility_of_distance: 0.0
        monetary_distance_cost_rate: 0.0
        daily_money_constant: 0.0
        daily_utility_constant: 0.0
        constant: 0.0
