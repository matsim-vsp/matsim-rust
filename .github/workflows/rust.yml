name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Omit debug symbols in CI to reduce linking time and cache size.
  CARGO_PROFILE_RELEASE_DEBUG: 0
  RUSTFLAGS: -D warnings

# A new push to a PR makes the previous run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt
      - name: Install other libraries
        # build-essential and cmake are needed because the protobuf-src dependency
        # compiles protoc from source.
        run: sudo apt -y install build-essential cmake libclang-dev llvm-dev libmetis-dev
      - name: Cache cargo and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --release --locked
      # Berlin integration runs take far too long for pull request feedback, so they
      # only run on main (and on manual dispatch).
      - name: Test
        env:
          RUST_BACKTRACE: 1
        run: cargo test --release --locked --features http -- --test-threads=1 --skip 'berlin::'
      - name: Test Berlin
        if: github.event_name != 'pull_request'
        env:
          RUST_BACKTRACE: 1
        run: 'cargo test --release --locked --test simulation berlin:: -- --test-threads=1'
