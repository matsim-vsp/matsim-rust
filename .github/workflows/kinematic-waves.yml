name: Kinematic waves validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'matsim_rust/src/simulation/network/**'
      - 'matsim_rust/src/simulation/controller/berlin_performance.rs'
      - '.github/workflows/kinematic-waves.yml'

jobs:
  berlin-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt
      - name: Record machine and source
        run: |
          mkdir -p performance-results
          { git rev-parse HEAD; rustc -Vv; uname -a; lscpu; } | tee performance-results/environment.txt
          sha256sum matsim_rust/assets/berlin-v6.4/* | tee performance-results/inputs.sha256
          cp matsim_rust/assets/berlin-v6.4/config.yml performance-results/config.yml
      - name: Berlin Queue baseline
        run: |
          set -o pipefail
          cargo test -p matsim-rust --release --lib berlin_performance -- --ignored --nocapture --test-threads=1 | tee performance-results/queue-before.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: berlin-performance
          path: performance-results
