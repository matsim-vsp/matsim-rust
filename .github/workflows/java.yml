name: Java

on:
  push:
    branches: [ "main" ]
    paths: [ "java/**", "proto/**", ".github/workflows/java.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "java/**", "proto/**", ".github/workflows/java.yml" ]

permissions:
  contents: read

jobs:
  router:
    name: Java router
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        working-directory: java
        run: mvn -B verify
